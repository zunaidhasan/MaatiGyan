name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.11"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      # Install only lightweight deps needed for unit tests to avoid
      # downloading torch (~2GB), earthengine-api, llama-index, etc.
      # The confidence tests use mock objects — ML/GEE imports happen
      # inside functions, not at module level, so heavy packages aren't
      # needed for the import chain to resolve.
      - name: Install core dependencies (lightweight)
        run: |
          python -m pip install --upgrade pip
          pip install \
            fastapi==0.115.0 \
            uvicorn==0.30.6 \
            python-multipart==0.0.9 \
            pydantic-settings==2.4.0 \
            python-dotenv==1.0.1 \
            httpx==0.27.2 \
            numpy==1.26.4 \
            scikit-learn==1.5.2 \
            scipy==1.14.1 \
            gtts==2.5.3 \
            Pillow==10.4.0 \
            aiofiles==24.1.0 \
            portalocker==3.2.0

      - name: Install test dependencies
        run: |
          pip install pytest pytest-cov

      - name: Run unit tests
        run: |
          python -m pytest backend/tests/ -v --cov=backend --cov-report=term --cov-report=xml

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 7

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install linting tools
        run: |
          python -m pip install --upgrade pip
          pip install flake8 black

      - name: Lint with flake8
        run: |
          flake8 backend/ --count --max-complexity=10 --statistics \
            --ignore=E203,E266,E501,W503
        continue-on-error: true

      - name: Check formatting with black
        run: |
          black --check --diff backend/ || echo "Run 'black backend/' to fix formatting"
        continue-on-error: true

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [test]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t maatigyan-api .

      - name: Verify image builds successfully
        run: |
          docker images maatigyan-api

      - name: Quick smoke test (start and healthcheck)
        run: |
          docker run -d --name maatigyan-test -p 8000:8000 \
            -e DEMO_MODE=true \
            maatigyan-api
          # Retry loop: wait up to 60s for the app to be ready
          for i in $(seq 1 12); do
            curl -sf http://localhost:8000/ && break
            echo "Waiting for app... attempt $i/12"
            sleep 5
          done
          curl -f http://localhost:8000/ || echo "Healthcheck skipped (no GEE creds expected)"
          docker stop maatigyan-test
          docker rm maatigyan-test
