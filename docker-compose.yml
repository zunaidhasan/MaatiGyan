version: "3.8"

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: maatigyan_api
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./audio_cache:/app/audio_cache
      - ./backend/gee_service_account_key.json:/app/backend/gee_service_account_key.json:ro
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  audio_cache:
    driver: local
